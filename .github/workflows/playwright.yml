name: Playwright Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers with System Dependencies
      run: playwright install --with-deps

    - name: Execute Pytest Suite
      run: pytest -v

    - name: Upload Test Results / Artifacts (on failure or completion)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-execution-results
        path: |
          report.html
          screenshots/
        retention-days: 7